<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MediReminder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f1f7fc;--cd:#fff;--tx:#12304a;--mu:#5b7690;--bl:#2a78c9;--b2:#dcebfa;--gr:#2f9c78;--g2:#dff4ec;--am:#b9780f;--a2:#fcf0d6;--rd:#c94848;--r2:#fbe3e3;--bd:#dae7f2;--sh:0 4px 18px rgba(30,80,130,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0d1a27;--cd:#142636;--tx:#e6f0f9;--mu:#8fa9c0;--bl:#5aa6f0;--b2:#1b3a57;--gr:#52c9a1;--g2:#16392f;--am:#e8b04f;--a2:#3b2f14;--rd:#ef7b7b;--r2:#3d1f23;--bd:#244158;--sh:0 4px 18px rgba(0,0,0,.35)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d1a27;--cd:#142636;--tx:#e6f0f9;--mu:#8fa9c0;--bl:#5aa6f0;--b2:#1b3a57;--gr:#52c9a1;--g2:#16392f;--am:#e8b04f;--a2:#3b2f14;--rd:#ef7b7b;--r2:#3d1f23;--bd:#244158;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{font-size:16px;scroll-padding-top:env(safe-area-inset-top,0px)}html.lg{font-size:20px}
body{margin:0;background:var(--bg);color:var(--tx);font:500 1rem/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.2}h2{font-size:1.35rem}h3{font-size:1.05rem}p{margin:.3rem 0}.mu{color:var(--mu);font-size:.9rem}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:1.1rem}
.btn{border:0;border-radius:12px;padding:.55rem 1rem;font-weight:700;background:var(--bl);color:#fff;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--gr);color:#fff}.btn.o{background:var(--b2);color:var(--bl)}.btn.r{background:var(--r2);color:var(--rd)}.btn.s{padding:.35rem .7rem;font-size:.85rem}
.in{width:100%;padding:.6rem .8rem;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg)}label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.bd{display:inline-block;padding:.15rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700}
.up{background:var(--b2);color:var(--bl)}.ok{background:var(--g2);color:var(--gr)}.od{background:var(--r2);color:var(--rd)}.sk{background:var(--a2);color:var(--am)}
#shell{display:flex;min-height:100vh}nav{width:220px;padding:4.2rem 1.2rem 1.2rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.3rem;border-right:1px solid var(--bd);background:var(--cd)}
.logo{font-weight:800;font-size:1.3rem;color:var(--bl);margin-bottom:1rem}.logo span{color:var(--gr)}
.nb{background:none;border:0;text-align:left;padding:.65rem .8rem;border-radius:12px;font-weight:600;color:var(--mu)}.nb.on{background:var(--b2);color:var(--bl)}
.gear{position:fixed;top:calc(.7rem + env(safe-area-inset-top,0px));right:.8rem;z-index:45;width:2.7rem;height:2.7rem;border-radius:50%;border:1px solid var(--bd);background:var(--cd);box-shadow:var(--sh);font-size:1.25rem;display:grid;place-items:center;padding:0}.gear.on{background:var(--b2);border-color:var(--bl)}.hm{right:auto;left:.8rem}
main{flex:1;padding:4.2rem 1.5rem 1.5rem;max-width:1000px;margin:0 auto;width:100%;padding-bottom:6rem}
.hero{background:linear-gradient(135deg,#2a78c9,#3fae9a);color:#fff;border:0}.hero .big{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dose{display:flex;gap:.8rem;align-items:center;padding:.8rem;border-radius:16px;border:1px solid var(--bd);background:var(--cd);margin:.5rem 0;animation:in .3s}
.dose img,.ph{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--b2);display:grid;place-items:center;font-size:1.4rem}
.dose.od{border-left:5px solid var(--rd)}.dose.up{border-left:5px solid var(--bl)}.dose.ok{border-left:5px solid var(--gr);opacity:.85}.dose.sk{border-left:5px solid var(--am);opacity:.85}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal b{font-size:.75rem;color:var(--mu)}
.cd{aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);background:var(--cd);font-size:.85rem;padding:0;min-height:2.2rem}.cd.sel{outline:2px solid var(--bl)}
.cd.g{background:var(--g2);color:var(--gr)}.cd.a{background:var(--a2);color:var(--am)}.cd.r{background:var(--r2);color:var(--rd)}.cd.b{background:var(--b2);color:var(--bl)}
.bar{height:10px;border-radius:9px;background:var(--b2);overflow:hidden}.bar i{display:block;height:100%;background:var(--gr);transition:width .5s}
.ov{position:fixed;inset:0;background:rgba(8,25,40,.55);display:none;place-items:center;padding:1rem;z-index:50;overflow:auto}.ov.on{display:grid}.ov .card{width:min(520px,100%);max-height:92vh;overflow:auto}
#al{padding:0;z-index:100}#al .card{width:100%;height:100%;max-height:none;border:0;border-radius:0;display:grid;place-items:center;background:linear-gradient(135deg,#2a78c9,#2f9c78);color:#fff;padding:1.5rem}#al h2{font-size:1.7rem}#al .mu{color:#e8f4ff;font-size:1.05rem}#al .em{font-size:5rem;animation:pl 1s infinite}#al .btn{padding:1rem 1.6rem;font-size:1.15rem}#al .btn.g{background:#fff;color:#1d7a5c}#al .btn.o{background:rgba(255,255,255,.25);color:#fff}#al .btn.r{background:rgba(0,0,0,.3);color:#fff}@keyframes pl{50%{transform:scale(1.18)}}
.warn{background:var(--a2);color:var(--am);padding:.6rem .9rem;border-radius:12px;font-size:.85rem}
[hidden]{display:none!important}#auth{min-height:100vh;display:grid;place-items:center;padding:1rem}#auth .card{width:min(420px,100%)}
.tl{border-left:3px solid var(--b2);margin-left:.5rem;padding-left:1rem}.tl .t{font-weight:800;color:var(--bl);margin-top:.8rem}
.chk{display:inline-flex;gap:.3rem;align-items:center;margin:.2rem .6rem .2rem 0;font-weight:500}.chk input{width:auto}
#pr{display:none}
@media(max-width:760px){#shell{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;justify-content:space-around;z-index:40;border-right:0;border-top:1px solid var(--bd);padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px))}.logo{display:none}.nb{text-align:center;font-size:.72rem;padding:.4rem .3rem}main{padding:4rem 1rem 6rem}.hero .big{font-size:2rem}}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff}#pr td,#pr th{border:1px solid #999;padding:4px 8px;text-align:left}#pr table{border-collapse:collapse;width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="auth"></div><div id="shell" hidden><button id="gear" class="gear" data-a="tab" data-id="set" aria-label="Settings">⚙️</button><button id="home" class="gear hm" data-a="tab" data-id="today" aria-label="Home">🏠</button><nav id="nav"></nav><main id="main"></main></div>
<div class="ov" id="fm"><div class="card" id="fmc"></div></div><div class="ov" id="al"><div class="card" id="alc"></div></div><div id="pr"></div>
<script>
const $=s=>document.querySelector(s),mem={};
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return mem[k]??null}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>ymd(new Date()),at=(d,t)=>new Date(d+'T'+t).getTime();
const ico={tablet:'💊',capsule:'💊',syrup:'🧴',injection:'💉',drops:'💧',inhaler:'🌬️',cream:'🧴',other:'⚕️'};
const DIS='MediReminder is a reminder tool only. It does not give medical advice, diagnoses, or dosing guidance and never replaces your doctor or pharmacist. Enter details exactly as prescribed.';
let U,D,P,tab='today',sd=today(),vw='day',mo=0,rg=7,lastA={},cnt={},queue=[],cur=null,photo='';
const hash=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const save=()=>sv('mr_d_'+U,D);
// ---------- auth
function authUI(up){$('#auth').hidden=false;$('#shell').hidden=true;$('#auth').innerHTML=`<div class="card"><div class="logo">Medi<span>Reminder</span></div><h2>${up?'Create your account':'Welcome back'}</h2><p class="mu">Gentle reminders for the medicines you already take.</p>${up?'<label for="nm">Your name</label><input class="in" id="nm" autocomplete="name">':''}<label for="em">Email</label><input class="in" id="em" type="email" autocomplete="email"><label for="pw">Password</label><input class="in" id="pw" type="password" autocomplete="${up?'new':'current'}-password"><p id="msg" class="mu" style="color:var(--rd)" role="alert"></p><div class="row" style="margin-top:.6rem"><button class="btn" data-a="${up?'signup':'signin'}">${up?'Sign up':'Sign in'}</button><button class="btn o" data-a="${up?'authin':'authup'}">${up?'I have an account':'Create account'}</button></div><p class="warn" style="margin-top:1rem">${DIS}</p><p class="mu">Accounts and data are stored privately on this device in this version (passwords are hashed, never saved as text).</p></div>`}
async function doAuth(up){const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value,us=ld('mr_users')||{};
 if(!e||p.length<6)return $('#msg').textContent='Enter an email and a password with at least 6 characters.';
 const h=await hash(e+':'+p);
 if(up){if(us[e])return $('#msg').textContent='That email already has an account. Sign in instead.';us[e]={name:$('#nm').value.trim()||'Friend',h};sv('mr_users',us)}
 else if(!us[e]||us[e].h!==h)return $('#msg').textContent='Email or password is incorrect.';
 sv('mr_sess',e);boot(e)}
function boot(e){U=e;D=ld('mr_d_'+e)||{name:ld('mr_name')||'Friend',profiles:[{id:'me',name:'Me'}],meds:[],logs:{},snz:{},set:{snooze:10,repeat:5,sound:1,vib:1,voice:0,large:0,theme:'auto',ec:{n:'',p:''}}};P=D.profiles[0].id;
 $('#auth').hidden=true;$('#shell').hidden=false;applySet();render();if('Notification' in window&&Notification.permission==='default')setTimeout(()=>toast(),500)}
function applySet(){document.documentElement.classList.toggle('lg',!!D.set.large);const t=D.set.theme;t==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',t)}
function toast(){if(!('Notification' in window)||Notification.permission!=='default')return;if(D.set.nd&&Date.now()-D.set.nd<2592e5)return;$('#fmc').innerHTML=`<div style="text-align:center"><div style="font-size:2.6rem">🔔</div><h2>Turn on notifications?</h2><p class="mu">Get a “Time to take [medicine name]” alert on your phone when it’s time. You can change this later in Settings.</p><div class="row" style="justify-content:center;margin-top:1rem"><button class="btn" data-a="permgo">Turn on notifications</button><button class="btn o" data-a="permno">Not now</button></div></div>`;$('#fm').classList.add('on')}
// ---------- schedule logic
const meds=()=>D.meds.filter(m=>m.p===P);
const applies=(m,d)=>{if(d<m.start||(m.end&&d>m.end))return false;if(m.paused&&d>=today())return false;const dt=new Date(d+'T12:00');
 if(m.fq==='days')return m.days.includes(dt.getDay());if(m.fq==='every')return Math.round((dt-new Date(m.start+'T12:00'))/864e5)%Math.max(1,m.ev)===0;return true};
const doses=d=>meds().filter(m=>applies(m,d)).flatMap(m=>m.times.map(t=>({id:m.id+'|'+d+'|'+t,m,d,t}))).sort((a,b)=>a.t.localeCompare(b.t));
const dueAt=x=>D.snz[x.id]||at(x.d,x.t);
function stat(x){const l=D.logs[x.id];if(l)return l.s;if(x.d<today())return'missed';return Date.now()>at(x.d,x.t)?'overdue':'upcoming'}
const lab={taken:['ok','Taken'],skipped:['sk','Skipped'],missed:['od','Missed'],overdue:['od','Overdue'],upcoming:['up','Upcoming']};
function nextDose(){for(let i=0;i<8;i++){const l=doses(addD(today(),i)).filter(x=>!D.logs[x.id]&&dueAt(x)>Date.now());if(l.length)return l.sort((a,b)=>dueAt(a)-dueAt(b))[0]}}
const fmt=t=>{const[h,m]=t.split(':');return(h%12||12)+':'+m+(h<12?' AM':' PM')};
function log(x,s){D.logs[x.id]={s,at:Date.now(),n:x.m.name,dz:x.m.dose,d:x.d,t:x.t,p:x.m.p,mid:x.m.id};delete D.snz[x.id];if(s==='taken'&&x.m.stock!=null&&x.m.stock>0)x.m.stock--;save()}
function stats(from,to){let t=0,k=0,s=0;for(let d=from;d<=to;d=addD(d,1))doses(d).forEach(x=>{const st=stat(x);if(st==='upcoming')return;t++;if(st==='taken')k++;if(st==='skipped')s++});return{t,k,s,m:t-k-s,pc:t?Math.round(k/t*100):0}}
// ---------- views
function dc(x,btn=true){const s=stat(x),[c,l]=lab[s],m=x.m;return`<div class="dose ${c}"><div class="ph">${m.photo?`<img src="${m.photo}" alt="">`:ico[m.type]||'💊'}</div><div style="flex:1;min-width:0"><b>${esc(m.name)}</b> <span class="mu">${esc(m.dose)}</span><div class="mu">${fmt(x.t)} · ${esc(m.type)}${m.notes?' · '+esc(m.notes):''}</div></div><div style="text-align:right"><span class="bd ${c}">${l}</span>${btn&&x.d<=today()?(D.logs[x.id]?`<div><button class="btn o s" data-a="undo" data-id="${x.id}">Undo</button></div>`:`<div class="row" style="margin-top:.3rem;justify-content:flex-end"><button class="btn g s" data-a="take" data-id="${x.id}">Taken</button><button class="btn o s" data-a="snz" data-id="${x.id}">Snooze</button><button class="btn r s" data-a="skip" data-id="${x.id}">Skip</button></div>`):''}</div></div>`}
function vToday(){const ds=doses(today()),done=ds.filter(x=>D.logs[x.id]?.s==='taken').length,pc=ds.length?Math.round(done/ds.length*100):0,n=nextDose(),h=new Date().getHours();
 const g=(a,f)=>ds.filter(x=>f.includes(stat(x)));const low=meds().filter(m=>m.stock!=null&&m.low!=null&&m.stock<=m.low);
 const sec=(t,l)=>l.length?`<h3 style="margin-top:1rem">${t}</h3>${l.map(x=>dc(x)).join('')}`:'';
 return`<div class="row sp"><div><h2>Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${esc(D.name)}</h2><p class="mu">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}${D.profiles.length>1?' · viewing '+esc(prof().name):''}</p></div><div class="row"><button class="btn" data-a="add">+ Add medicine</button><button class="btn o" data-a="read">🔊 Read today</button></div></div>
 <div class="grid g2" style="margin-top:1rem"><div class="card hero"><div>Next medicine</div>${n?`<div class="big" id="cd" data-t="${dueAt(n)}">${(()=>{const s=Math.max(0,Math.round((dueAt(n)-Date.now())/1e3));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)})()}</div><div>${esc(n.m.name)} ${esc(n.m.dose)} · ${n.d===today()?'':(n.d===addD(today(),1)?'tomorrow':n.d)+' · '}${fmt(n.t)}</div>`:'<div class="big">All clear</div><div>No upcoming doses scheduled.</div>'}</div>
 <div class="card"><div class="row sp"><h3>Daily progress</h3><b>${done}/${ds.length}</b></div><div class="bar" style="margin:.8rem 0"><i style="width:${pc}%"></i></div><p class="mu">${ds.length?pc+'% of today’s doses taken':'Nothing scheduled today.'}</p><div class="row"><span class="bd ok">${done} taken</span><span class="bd od">${g(0,['overdue']).length} overdue</span><span class="bd up">${g(0,['upcoming']).length} upcoming</span></div></div></div>
 ${'Notification' in window&&Notification.permission!=='granted'?'<p class="warn">Turn on notifications so “Time to take” reminders show on your phone screen. '+(Notification.permission==='denied'?'They are blocked right now. Allow notifications for this site in your browser or phone settings, then reload.':'<button class="btn s" data-a="perm">Turn on</button>')+'</p>':''}
 ${low.map(m=>`<p class="warn">Refill reminder: ${esc(m.name)} has ${m.stock} left. Contact your pharmacy.</p>`).join('')}
 ${!ds.length?'<div class="card" style="margin-top:1rem;text-align:center"><h3>No medicines yet</h3><p class="mu">Add a medicine exactly as prescribed to start reminders.</p><button class="btn" data-a="add">Add medicine</button></div>':''}
 ${sec('Overdue',g(0,['overdue']))}${sec('Upcoming',g(0,['upcoming']))}${sec('Taken',g(0,['taken']))}${sec('Skipped',g(0,['skipped']))}
 ${D.set.ec.p?`<p class="mu" style="margin-top:1.2rem">Emergency contact: <a href="tel:${esc(D.set.ec.p)}">${esc(D.set.ec.n||'Call')} ${esc(D.set.ec.p)}</a></p>`:''}`}
const prof=()=>D.profiles.find(p=>p.id===P);
function calHTML(sel){const b=new Date();b.setDate(1);b.setMonth(b.getMonth()+mo);const y=b.getFullYear(),m=b.getMonth(),n=new Date(y,m+1,0).getDate();let h=`<div class="row sp"><button class="btn o s" data-a="mo" data-id="-1" aria-label="Previous month">‹</button><b>${b.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="btn o s" data-a="mo" data-id="1" aria-label="Next month">›</button></div><div class="cal" style="margin-top:.6rem">${'SMTWTFS'.split('').map(c=>`<b>${c}</b>`).join('')}${'<span></span>'.repeat(b.getDay())}`;
 for(let i=1;i<=n;i++){const d=y+'-'+pad(m+1)+'-'+pad(i),ds=doses(d);let c='';if(ds.length){const k=ds.filter(x=>stat(x)==='taken').length,u=ds.filter(x=>stat(x)==='upcoming'||stat(x)==='overdue').length;c=d>today()||u&&d===today()?'b':k===ds.length?'g':k?'a':'r'}h+=`<button class="cd ${c} ${sel&&d===sd?'sel':''}" data-a="day" data-id="${d}">${i}</button>`}
 return h+'</div><p class="mu">Green all taken · amber partly · red missed · blue upcoming</p>'}
function vSched(){let body='';
 if(vw==='day')body=`<div class="row sp"><button class="btn o s" data-a="dd" data-id="-1">‹</button><b>${new Date(sd+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}</b><button class="btn o s" data-a="dd" data-id="1">›</button></div><div class="tl">${doses(sd).map(x=>`<div class="t">${fmt(x.t)}</div>${dc(x)}`).join('')||'<p class="mu">Nothing scheduled.</p>'}</div>`;
 if(vw==='week'){const s=new Date(sd+'T12:00');s.setDate(s.getDate()-s.getDay());const st=ymd(s);body='<div class="grid g2">'+[0,1,2,3,4,5,6].map(i=>{const d=addD(st,i);return`<div class="card"><b>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</b>${doses(d).map(x=>`<div class="row" style="margin-top:.3rem"><span class="bd ${lab[stat(x)][0]}">${fmt(x.t)}</span>${esc(x.m.name)}</div>`).join('')||'<p class="mu">Free day</p>'}</div>`}).join('')+'</div>'}
 if(vw==='month')body=`<div class="card">${calHTML(1)}</div><div style="margin-top:1rem">${doses(sd).map(x=>dc(x)).join('')}</div>`;
 return`<div class="row sp"><h2>Schedule</h2><div class="row">${['day','week','month'].map(v=>`<button class="btn ${vw===v?'':'o'} s" data-a="vw" data-id="${v}">${v}</button>`).join('')}</div></div><div style="margin-top:1rem">${body}</div>`}
function vMeds(){const q=($('#q')?.value||'').toLowerCase();return`<div class="row sp"><h2>My medicines</h2><button class="btn" data-a="add">+ Add medicine</button></div><input class="in" id="q" placeholder="Search your medicines" style="margin:1rem 0" value="${esc(q)}" aria-label="Search medicines"><div class="grid g2" id="ml">${medList(q)}</div>`}

doAuth=function(){const n=$('#nm').value.trim();if(!n)return $('#msg').textContent='Enter your name to continue.';sv('mr_name',n);boot('local');D.name=n;save();render()};
