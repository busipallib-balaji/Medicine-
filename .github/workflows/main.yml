name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      -       - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0'

      - name: Extract MediReminder project
        run: |
          mkdir -p extracted app
          unzip -q MediReminder-Android-app.zip -d extracted

          PROJECT_DIR=$(find extracted -name package.json -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found in ZIP"
            exit 1
          fi

          cp -a "$PROJECT_DIR/." app/

          if [ ! -f app/www/index.html ]; then
            echo "www/index.html is missing"
            exit 1
          fi

      - name: Install dependencies
        working-directory: app
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      
