
name: MediReminder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f MediReminder-apk.zip ]; then
            echo "ERROR: MediReminder-apk.zip not found"
            exit 1
          fi

      - name: Extract APK
        run: |
          mkdir -p extracted output

          unzip -q MediReminder-apk.zip -d extracted

          APK_FILE=$(find extracted -type f -name "*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found inside ZIP"
            exit 1
          fi

          cp "$APK_FILE" output/MediReminder.apk

          echo "APK extracted successfully"

      - name: Upload MediReminder APK
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-APK
          path: output/MediReminder.apk
          if-no-files-found: error
          retention-days: 30
