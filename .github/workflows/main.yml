
name: MediReminder Android APK v5.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check ZIP file
        run: |
          test -f MediReminder-Android-app-v5.0.zip

      - name: Extract MediReminder project
        run: |
          mkdir -p project
          unzip -q MediReminder-Android-app-v5.0.zip -d project

          test -f project/package.json
          test -f project/capacitor.config.json
          test -f project/scripts/patch-android.py

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Generate Android project
        working-directory: project
        run: npx cap add android

      - name: Generate Android icons
        working-directory: project
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: project
        run: npx cap sync android

      - name: Install native alarm functionality
        working-directory: project
        run: python3 scripts/patch-android.py

      - name: Build MediReminder APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload MediReminder APK
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-APK-v5.0
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
