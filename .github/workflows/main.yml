
name: MediReminder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          ZIP_FILE="MediReminder-Android-app-v5.0.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

      - name: Extract APK
        run: |
          mkdir -p extracted output

          unzip -q MediReminder-Android-app-v5.0.zip -d extracted

          echo "Files found inside ZIP:"
          find extracted -type f

          APK_FILE=$(find extracted -type f -iname "*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found inside ZIP"
            echo "Please check the ZIP contents."
            exit 1
          fi

          cp "$APK_FILE" output/MediReminder.apk

          echo "APK extracted successfully"

      - name: Upload MediReminder APK
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-APK-v5.0
          path: output/MediReminder.apk
          if-no-files-found: error
          retention-days: 30
